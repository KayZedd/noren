name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin noren
      - run: cargo build --release --features studio --bin noren-studio
      - run: cargo install rsign2 --locked
      - name: Sum and sign
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          mkdir dist
          cp target/release/noren.exe target/release/noren-studio.exe dist/
          cd dist
          sha256sum noren.exe noren-studio.exe > SHA256SUMS
          printf '%s\n' "$MINISIGN_KEY" > ../minisign.key
          # The updater requires the trusted comment to name this tag.
          rsign sign -W -s ../minisign.key -t "noren ${GITHUB_REF_NAME}" SHA256SUMS
          rm ../minisign.key
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "noren $GITHUB_REF_NAME" --generate-notes
