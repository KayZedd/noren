[package]
name = "noren"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Pure-Rust framework for customizing the Windows desktop: panels, desktop widgets, overlays. Declarative elements, software rendering."

[features]
default = []
preview = ["dep:winit", "dep:softbuffer"]

[dependencies]
cosmic-text = "0.19"
resvg = { version = "0.49", default-features = false }
taffy = "0.15"
tiny-skia = "0.12"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
sysinfo = "0.40"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[example]]
name = "pulse"
test = true
